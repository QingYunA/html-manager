<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reaction Time Test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #18181b;
      color: #fafafa;
      text-align: center;
      transition: background 0.15s ease;
      cursor: pointer;
    }
    .container { max-width: 500px; padding: 2rem; pointer-events: none; }
    h1 { font-size: 2.5rem; margin-bottom: 1rem; font-weight: 700; letter-spacing: -0.03em; }
    p { font-size: 1.1rem; opacity: 0.85; line-height: 1.6; }
    .ms { font-size: 4rem; font-weight: 800; font-family: ui-monospace, monospace; margin: 1rem 0; }
    .badge {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.4rem 1rem;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 9999px;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body id="arena">
  <div class="container" id="box">
    <h1>Reaction Time Test</h1>
    <p>When the screen turns <strong style="color: #4ade80;">GREEN</strong>, click as quickly as you can.</p>
    <div class="badge">Click anywhere to start</div>
  </div>

  <script>
    const arena = document.getElementById('arena');
    const box = document.getElementById('box');
    let state = 'waiting'; // 'waiting', 'ready', 'now', 'result'
    let timer = null;
    let startTime = 0;

    arena.addEventListener('mousedown', handleClick);
    arena.addEventListener('touchstart', handleClick, { passive: true });

    function handleClick() {
      if (state === 'waiting' || state === 'result') {
        state = 'ready';
        arena.style.background = '#dc2626'; // Red
        box.innerHTML = '<h1>Wait for green...</h1><p>Do not click yet!</p>';
        
        const randomMs = Math.floor(Math.random() * 3000) + 1500;
        timer = setTimeout(() => {
          state = 'now';
          startTime = performance.now();
          arena.style.background = '#16a34a'; // Green
          box.innerHTML = '<h1>CLICK NOW!</h1>';
        }, randomMs);
      } else if (state === 'ready') {
        clearTimeout(timer);
        state = 'result';
        arena.style.background = '#09090b';
        box.innerHTML = '<h1>Too Early!</h1><p>You clicked before it turned green.</p><div class="badge">Click to try again</div>';
      } else if (state === 'now') {
        const diff = Math.round(performance.now() - startTime);
        state = 'result';
        arena.style.background = '#09090b';
        let rating = 'Fast reflexes! ⚡';
        if (diff > 300) rating = 'Decent! Keep practicing 🎯';
        if (diff < 200) rating = 'Inhuman speed! 🚀';
        box.innerHTML = `<h1>Your Speed</h1><div class="ms">${diff} ms</div><p>${rating}</p><div class="badge">Click to play again</div>`;
      }
    }
  </script>
</body>
</html>
